name: Release

# Build the four desktop packages and attach them to a GitHub Release:
#   - Windows x64 NSIS installer (Setup.exe)
#   - Windows x64 portable archive (Portable.exe)
#   - macOS universal DMG (Intel + Apple Silicon, unsigned smoke build;
#     signed+notarized releases stay a manual credentialed step)
#   - Linux x64 AppImage + tar.gz
#
# Trigger: push a v* tag, or dispatch manually with a new tag name.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v2.0.3-sci.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Full headless product gate before any packaging starts.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn check

  # Create the draft release first so platform jobs can upload directly.
  draft:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      upload-url-ready: ${{ steps.draft.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "DSH Desktop Science $RELEASE_TAG" \
            --notes "Automated build of DSH Desktop with the preinstalled science layer (dsh-science). Packages are attached by the platform jobs." \
            --draft
          echo "ready=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: draft
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      # dist:win runs check:win-package (build + Windows gates) internally.
      - name: Build Windows installer
        run: yarn workspace dsh-plugin-desktop dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable
      - name: Upload Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" --clobber `
            "dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Setup.exe" `
            "dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Portable.zip"

  macos:
    needs: draft
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      # dist:mac-smoke runs check:mac-package internally and produces an
      # unsigned universal DMG (Intel + Apple Silicon).
      - name: Build macOS universal DMG
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke
      - name: Upload macOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "${{ github.repository }}" --clobber \
            dsh-plugin-desktop/dist/*.dmg

  linux:
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Build Linux AppImage and tar.gz
        run: yarn dist:linux
      - name: Upload Linux artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "${{ github.repository }}" --clobber \
            dsh-plugin-desktop/dist/*.AppImage \
            dsh-plugin-desktop/dist/*.tar.gz

  # Publish once every platform artifact landed on the draft.
  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --draft=false "${args[@]}"
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}"
